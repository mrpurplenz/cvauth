# CVAuth configuration file
# Version 1 — stable

[cvauth.identity]
callsign = ""
ssid = ""

[cvauth.keys]
private_key = "keys/private.pem"
public_key  = "keys/public.pem"

[cvauth.keystore]
trusted_keys_dir = "trusted_keys"

[cvauth.behaviour]
allow_unsigned = true
allow_invalid_signatures = true

[cvauth.config_location]
config_path = ""


